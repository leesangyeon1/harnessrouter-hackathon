name: Finance core

on:
  pull_request:
    paths: ['packages/finance-core/**', '.github/workflows/finance-core.yml']
  push:
    branches: [main, dev]
    paths: ['packages/finance-core/**', '.github/workflows/finance-core.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'ruff==0.17.5' 'mypy==2.4.1' build
      - run: python -m pip install -e packages/finance-core
      - run: python -m unittest discover -s packages/finance-core/tests -v
      - run: ruff check packages/finance-core
      - run: ruff format --check packages/finance-core
      - run: mypy --config-file pyproject.toml
        working-directory: packages/finance-core
      - run: python -m build
        working-directory: packages/finance-core
