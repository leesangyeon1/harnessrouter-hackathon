[project]
name = "finance-api"
version = "0.1.0"
description = "FastAPI service, migrations and jobs of the finance platform MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "harnessrouter-finance-core",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.32",
]

[tool.uv.sources]
harnessrouter-finance-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]
